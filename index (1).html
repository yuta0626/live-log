<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE LOG</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--txt:#f8fafc;--nogi:#812990;--bump:#ef4444;--oda:#3b82f6}body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--txt)}header{padding:20px;background:#111827}nav{display:flex;gap:8px;padding:12px}button{padding:8px 12px}.panel{padding:16px}.card{background:var(--panel);padding:12px;border-radius:10px;margin:8px}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--border);padding:8px} .artist-bump{color:var(--bump)} .artist-nogi{color:var(--nogi)} .artist-oda{color:var(--oda)}</style></head><body><header><h1>LIVE LOG</h1></header><nav><button>統計</button><button>ライブ一覧</button><button>演奏曲</button></nav><div class="panel"><h2>設計ベース版</h2><p>ダッシュボード・ライブ一覧・演奏曲一覧・グラフの土台です。</p><canvas id="songChart"></canvas></div><script>new Chart(document.getElementById('songChart'),{type:'bar',data:{labels:['サンプル'],datasets:[{label:'披露回数',data:[1]}]}});</script></body></html>
