<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LIVE LOG</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
 --bg:#0f172a;
 --panel:#1e293b;
 --border:#334155;
 --txt:#f8fafc;

 --bump:#ef4444;
 --nogi:#812990;
 --oda:#3b82f6;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font-family:sans-serif;
}

header{
 background:#111827;
 padding:20px;
 position:sticky;
 top:0;
 z-index:100;
}

h1{
 margin:0;
}

.container{
 max-width:1600px;
 margin:auto;
 padding:16px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px;
 margin-bottom:20px;
}

.card{
 background:var(--panel);
 border-radius:12px;
 padding:16px;
}

.cardTitle{
 opacity:.8;
}

.cardValue{
 font-size:32px;
 font-weight:bold;
 margin-top:8px;
}

.bump{
 color:var(--bump);
}

.nogi{
 color:var(--nogi);
}

.oda{
 color:var(--oda);
}

.panel{
 background:var(--panel);
 border-radius:12px;
 padding:16px;
 margin-bottom:20px;
}

.tabs{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:20px;
}

.tabBtn{
 border:none;
 border-radius:8px;
 padding:10px 14px;
 cursor:pointer;
}

.tab{
 display:none;
}

.tab.active{
 display:block;
}

.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:16px;
}

input,
select{
 padding:8px;
 border-radius:8px;
 border:none;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,
td{
 border:1px solid var(--border);
 padding:8px;
}

th{
 background:#142033;
}

tbody tr:nth-child(even){
 background:#243146;
}

canvas{
 background:white;
 border-radius:8px;
}

</style>

</head>

function showTab(id){

 document
 .querySelectorAll(".tab")
 .forEach(tab=>{
  tab.classList.remove("active");
 });

 document
 .getElementById(id)
 .classList.add("active");

}

const yearSelect =
document.getElementById("yearFilter");

[
 ...new Set(
  liveData.map(
   item => item.date.substring(0,4)
  )
 )
]

.sort()

.forEach(year => {

 const option =
 document.createElement("option");

 option.value = year;
 option.textContent = year;

 yearSelect.appendChild(option);

});

function renderLiveTable(){

 const artist =
 document.getElementById(
  "artistFilter"
 ).value;

 const year =
 document.getElementById(
  "yearFilter"
 ).value;

 const tbody =
 document.getElementById(
  "liveTable"
 );

 tbody.innerHTML = "";

 liveData

 .filter(item => {

  if(
   artist &&
   item.artist !== artist
  ){
   return false;
  }

  return true;

 })

 .filter(item => {

  if(
   year &&
   !item.date.startsWith(year)
  ){
   return false;
  }

  return true;

 })

 .forEach(item => {

  let colorClass = "";

  if(item.artist==="BUMP"){
   colorClass="bump";
  }

  if(item.artist==="乃木坂"){
   colorClass="nogi";
  }

  if(item.artist==="小田和正"){
   colorClass="oda";
  }

  tbody.innerHTML += `
  <tr>
   <td>${item.date}</td>
   <td class="${colorClass}">
    ${item.artist}
   </td>
   <td>${item.pref}</td>
   <td>${item.venue}</td>
   <td>
    ${item.ticket.toLocaleString()}円
   </td>
  </tr>
  `;

 });

}

function renderSongTables(){

 const bumpBody =
 document.getElementById(
  "bumpSongTable"
 );

 bumpBody.innerHTML = "";

 bumpSongs

 .sort((a,b)=>
  b.count-a.count
 )

 .forEach(song=>{

  bumpBody.innerHTML += `
  <tr>
   <td>${song.name}</td>
   <td>${song.count}</td>
  </tr>
  `;

 });

 const nogiBody =
 document.getElementById(

  </tr>
  `;

}

document

const yearlyStats = {};

liveData.forEach(live=>{

 const year =
 live.date.substring(0,4);

 if(!yearlyStats[year]){

  yearlyStats[year]={
   BUMP:0,
   乃木坂:0,
   小田和正:0
  };

 }

 yearlyStats[year][live.artist]++;

});

const chartYears =
Object.keys(yearlyStats).sort();

new Chart(

 document.getElementById("yearChart"),

 {

  type:"bar",

  data:{

   labels:chartYears,

   datasets:[

    {
     label:"BUMP",
     backgroundColor:"#ef4444",
     data:chartYears.map(
      year =>
      yearlyStats[year]["BUMP"]||0
     )
    },

     label:"乃木坂",
     backgroundColor:"#812990",
