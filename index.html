<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f30;--line:#29364b;--muted:#9aabc2;--txt:#f4f7fb;--accent:#80b7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}

main{max-width:1100px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.stat small{display:block;color:var(--muted)}.stat b{font-size:21px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input,.toolbar select,input,textarea{background:#0e1726;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.toolbar input{flex:1;min-width:170px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:680px;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#1d2a3e;color:#cbd9eb;position:sticky;top:0}td.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.pill{font-size:11px;border:1px solid #45617f;border-radius:99px;padding:2px 7px;color:#b8d6ff}
h2{font-size:17px;margin:0 0 10px}.notice{font-size:12px;color:var(--muted);margin:10px 0}.hidden{display:none}.songlist{display:grid;grid-template-columns:1fr auto;gap:0 12px}.songlist div{padding:7px 2px;border-bottom:1px solid var(--line)}.count{color:#b8d6ff;font-variant-numeric:tabular-nums}
@media(max-width:560px){main{padding:12px}.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:9px}.stat b{font-size:16px}.stat small{font-size:10px}.panel{padding:11px}}

function renderSongs(){let artist=document.getElementById('songArtist').value,q=document.getElementById('songSearch').value.toLowerCase();
