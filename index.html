<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>LIVE LOG</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#202331;--muted:#73798b;--line:#e5e7ef;--accent:#6257d9;--accent2:#eeeaff;--danger:#c43d52;--shadow:0 5px 20px #2023310c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;padding:20px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:25px;font-weight:850;letter-spacing:.08em}.brand small{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:600;margin-top:3px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:650}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 18px;padding-bottom:3px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px;color:var(--muted);font-weight:700}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat,.panel,.live-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:14px}.stat .k{font-size:12px;color:var(--muted);font-weight:650}.stat .v{font-size:23px;font-weight:800;margin-top:5px}.panel{padding:17px;margin-bottom:15px}.panel h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{flex:1;min-width:160px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.toolbar input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:105px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.hidden{display:none!important}.live-list{display:grid;gap:12px}.live-card{padding:15px}.card-head{display:flex;justify-content:space-between;gap:12px}.card-title{font-size:17px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:11px;background:var(--accent2);color:#5145bd;border-radius:99px;padding:5px 8px;font-weight:700}.card-actions{display:flex;gap:6px;align-items:flex-start}.money{font-size:18px;font-weight:800;margin-top:10px}.setlist{white-space:pre-line;color:#555c6e;font-size:13px;margin-top:9px;line-height:1.7}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px}.artist-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.hint{font-size:12px;color:var(--muted);line-height:1.6}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.modal-back{position:fixed;inset:0;background:#10121dcc;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal{background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:19px}.modal h2{margin:0 0 16px}.cost-row{display:grid;grid-template-columns:1fr 120px 36px;gap:7px;margin-bottom:8px}.cost-row input,.cost-row select{min-width:0;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.cost-row button{border:0;background:#fff;color:var(--danger);font-size:20px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:25px}
@media(max-width:600px){.app{padding:15px 12px 35px}.brand{font-size:22px}.top{align-items:flex-start}.top-actions .btn{padding:8px 10px;font-size:12px}.stats{gap:7px}.stat{padding:11px}.stat .v{font-size:18px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.card-head{display:block}.card-actions{margin-top:10px}.cost-row{grid-template-columns:1fr 95px 32px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">LIVE LOG<small>YOUR LIVE HISTORY</small></div>
  <div class="top-actions">
    <button class="btn" id="exportBtn">バックアップ</button>
    <button class="btn" id="importBtn">復元</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
</header>
<nav class="tabs" aria-label="メニュー">
  <button class="tab active" data-tab="lives">ライブ記録</button>
  <button class="tab" data-tab="songs">演奏曲</button>
  <button class="tab" data-tab="stats">費用集計</button>
</nav>
<section id="livesView">
  <div class="stats">
    <div class="stat"><div class="k">ライブ参加数</div><div class="v" id="countStat">0</div></div>
    <div class="stat"><div class="k">総費用</div><div class="v" id="totalStat">¥0</div></div>
    <div class="stat"><div class="k">登録アーティスト</div><div class="v" id="artistStat">0</div></div>
  </div>
  <div class="section-title"><h2 style="margin:0">ライブ履歴</h2><button class="btn primary" id="addBtn">＋ ライブを追加</button></div>
  <div class="toolbar"><input id="search" placeholder="アーティスト・会場で検索"></div>
  <div class="live-list" id="liveList"></div>
</section>
<section id="songsView" class="hidden">
  <div class="panel"><h2>演奏曲ランキング</h2><p class="hint">登録したセットリストから曲ごとの演奏回数を集計します。</p><div id="songRanking"></div></div>
  <div class="panel"><h2>アーティスト別セットリスト</h2><div id="artistSongs"></div></div>
</section>
<section id="statsView" class="hidden">
  <div class="stats">
    <div class="stat"><div class="k">チケット代</div><div class="v" id="ticketStat">¥0</div></div>
    <div class="stat"><div class="k">交通費</div><div class="v" id="transportStat">¥0</div></div>
    <div class="stat"><div class="k">宿泊費</div><div class="v" id="hotelStat">¥0</div></div>
  </div>
  <div class="panel"><h2>アーティスト別費用</h2><div id="artistCosts"></div></div>
  <div class="panel"><h2>費用の内訳</h2><div class="table-wrap"><table><thead><tr><th>日付</th><th>アーティスト</th><th>項目</th><th>金額</th></tr></thead><tbody id="expenseRows"></tbody></table></div></div>
</section>
<div class="footer">LIVE LOG · データはこのブラウザ内に保存されます。定期的にバックアップしてください。</div>
</div>
<div id="modalRoot"></div>
<script>
(() => {
'use strict';
const KEY='live-log-data-v1';
let lives=load();
let editing=null;
const $=id=>document.getElementById(id);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(lives));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function expenses(l){return Array.isArray(l.expenses)?l.expenses:[]}
function total(l){return expenses(l).reduce((a,e)=>a+Number(e.amount||0),0)}
function dateLabel(s){return s?new Date(s+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}):'日付未設定'}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const filtered=[...lives].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).filter(l=>(l.artist+' '+l.venue+' '+l.name).toLowerCase().includes(q));
 $('countStat').textContent=lives.length;
 $('totalStat').textContent=yen(lives.reduce((a,l)=>a+total(l),0));
 $('artistStat').textContent=new Set(lives.map(l=>l.artist).filter(Boolean)).size;
 $('liveList').innerHTML=filtered.length?filtered.map(l=>`<article class="live-card">
 <div class="card-head"><div><div class="card-title">${esc(l.name||l.artist||'ライブ')}</div><div class="sub">${esc(dateLabel(l.date))}　${esc(l.venue||'会場未設定')} ${l.artist?' · '+esc(l.artist):''}</div></div>
 <div class="card-actions"><button class="btn small" data-edit="${l.id}">編集</button><button class="btn small danger" data-delete="${l.id}">削除</button></div></div>
 <div class="chips">${expenses(l).map(e=>`<span class="chip">${esc(e.type)} ${yen(e.amount)}</span>`).join('')}</div>
 <div class="money">合計 ${yen(total(l))}</div>
 ${l.setlist?`<div class="setlist">♪ ${esc(l.setlist)}</div>`:''}
 ${l.memo?`<div class="sub">${esc(l.memo)}</div>`:''}
 </article>`).join(''):'<div class="empty">ライブ記録はまだありません。<br>「＋ ライブを追加」から登録してください。</div>';
 renderSongs();renderStats();
}
function showTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['lives','songs','stats'].forEach(t=>$(t+'View').classList.toggle('hidden',t!==tab))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
$('search').addEventListener('input',render);
function openForm(id=null){
 editing=id;const l=id?lives.find(x=>x.id===id):null;
 const costRows=(l?expenses(l):[{type:'チケット',amount:''},{type:'交通費',amount:''},{type:'宿泊費',amount:''}]).map(costRow).join('');
 $('modalRoot').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal"><h2>${l?'ライブ記録を編集':'ライブを追加'}</h2>
 <form id="liveForm"><div class="form-grid">
 <div class="field"><label>ライブ名・公演名</label><input name="name" value="${esc(l?.name||'')}" placeholder="例：全国ツアー 東京公演"></div>
 <div class="field"><label>アーティスト *</label><input name="artist" required value="${esc(l?.artist||'')}" placeholder="例：BUMP OF CHICKEN"></div>
 <div class="field"><label>開催日</label><input type="date" name="date" value="${esc(l?.date||'')}"></div>
 <div class="field"><label>会場</label><input name="venue" value="${esc(l?.venue||'')}" placeholder="例：東京ドーム"></div>
 <div class="field wide"><label>費用</label><div id="costRows">${costRows}</div><button type="button" class="btn small" id="addCost">＋ 費用項目を追加</button></div>
 <div class="field wide"><label>セットリスト（1曲ずつ改行）</label><textarea name="setlist" placeholder="曲名を1行ずつ入力">${esc(l?.setlist||'')}</textarea></div>
 <div class="field wide"><label>メモ</label><textarea name="memo" style="min-height:65px" placeholder="感想・座席・同行者など">${esc(l?.memo||'')}</textarea></div>
 </div><div class="form-actions"><button type="button" class="btn" id="cancelForm">キャンセル</button><button class="btn primary" type="submit">保存する</button></div></form></div></div>`;
 $('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeForm()});
 $('cancelForm').onclick=closeForm;$('addCost').onclick=()=>{$('costRows').insertAdjacentHTML('beforeend',costRow({type:'その他',amount:''}))};
 $('liveForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const obj={id:id||String(Date.now()),name:fd.get('name').trim(),artist:fd.get('artist').trim(),date:fd.get('date'),venue:fd.get('venue').trim(),setlist:fd.get('setlist').trim(),memo:fd.get('memo').trim(),expenses:[...$('costRows').querySelectorAll('.cost-row')].map(r=>({type:r.querySelector('select').value,amount:Number(r.querySelector('input').value||0)})).filter(x=>x.amount>0)};if(id)lives=lives.map(x=>x.id===id?obj:x);else lives.push(obj);closeForm();save()};
}
function costRow(e){return `<div class="cost-row"><select aria-label="費用項目">${['チケット','交通費','宿泊費','食費','グッズ','その他'].map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select><input type="number" min="0" step="1" placeholder="金額" value="${esc(e.amount)}" aria-label="金額"><button type="button" title="削除" onclick="this.parentElement.remove()">×</button></div>`}
function closeForm(){$('modalRoot').innerHTML='';editing=null}
$('addBtn').onclick=()=>openForm();$('liveList').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit)openForm(edit.dataset.edit);if(del&&confirm('このライブ記録を削除しますか？')){lives=lives.filter(l=>l.id!==del.dataset.delete);save()}});
function renderSongs(){
 const songs={};const artists={};
 lives.forEach(l=>{const list=(l.setlist||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!artists[l.artist])artists[l.artist]=[];list.forEach(s=>{songs[s]=(songs[s]||0)+1;artists[l.artist].push(s)})});
 const ranking=Object.entries(songs).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ja'));
 $('songRanking').innerHTML=ranking.length?ranking.map(([s,n],i)=>`<div class="artist-row"><span>${i+1}. ${esc(s)}</span><strong>${n}回</strong></div>`).join(''):'<div class="empty">セットリストがまだ登録されていません。</div>';
 $('artistSongs').innerHTML=Object.keys(artists).length?Object.entries(artists).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([a,ss])=>`<div class="artist-row"><div><strong>${esc(a)}</strong><div class="sub">${[...new Set(ss)].map(esc).join(' ／ ')}</div></div><strong>${ss.length}曲</strong></div>`).join(''):'<div class="empty">アーティストの記録がありません。</div>';
}
function renderStats(){
 const sums={'チケット':0,'交通費':0,'宿泊費':0};const by={};let rows=[];
 lives.forEach(l=>{by[l.artist]=(by[l.artist]||0)+total(l);expenses(l).forEach(e=>{if(sums[e.type]!==undefined)sums[e.type]+=Number(e.amount||0);rows.push({date:l.date,artist:l.artist,type:e.type,amount:e.amount})})});
 $('ticketStat').textContent=yen(sums['チケット']);$('transportStat').textContent=yen(sums['交通費']);$('hotelStat').textContent=yen(sums['宿泊費']);
 $('artistCosts').innerHTML=Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<div class="artist-row"><strong>${esc(a)}</strong><strong>${yen(n)}</strong></div>`).join(''):'<div class="empty">費用データがありません。</div>';
 $('expenseRows').innerHTML=rows.length?rows.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<tr><td>${esc(dateLabel(r.date))}</td><td>${esc(r.artist)}</td><td>${esc(r.type)}</td><td>${yen(r.amount)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">費用データがありません。</td></tr>';
}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),lives},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='live-log-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.lives;if(!Array.isArray(incoming))throw Error();if(!confirm('現在の記録をバックアップファイルの内容に置き換えます。よろしいですか？'))return;lives=incoming.map((l,i)=>({...l,id:String(l.id||Date.now()+i),expenses:Array.isArray(l.expenses)?l.expenses:[]}));save();alert('バックアップを復元しました。')}catch(err){alert('読み込めませんでした。LIVE LOGのJSONバックアップを選択してください。')}e.target.value=''};
render();
})();
</script>
</body>
</html>
