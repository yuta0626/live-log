<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE LOG</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
 --bg:#0f172a;
 --panel:#1e293b;
 --border:#334155;
 --text:#f8fafc;

 --bump:#ef4444;
 --nogi:#812990;
 --oda:#3b82f6;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:sans-serif;
}

header{
 padding:20px;
 background:#111827;
 position:sticky;
 top:0;
 z-index:100;
}

header h1{
 margin:0;
}

.container{
 max-width:1400px;
 margin:auto;
 padding:16px;
}

.cards{
 display:grid;
 gap:12px;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 margin-bottom:20px;
}

.card{
 background:var(--panel);
 border-radius:12px;
 padding:16px;
}

.card-title{
 font-size:14px;
 opacity:.8;
}

.card-value{
 font-size:30px;
 font-weight:bold;
 margin-top:8px;
}

.bump{
 color:var(--bump);
}

.nogi{
 color:var(--nogi);
}

.oda{
 color:var(--oda);
}

.panel{
 background:var(--panel);
 border-radius:12px;
 padding:16px;
 margin-bottom:20px;
}

.panel h2{
 margin-top:0;
}

.filters{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:16px;
}

select{
 padding:8px;
 border-radius:6px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th{
 background:#1a2233;
 position:sticky;
 top:70px;
 z-index:10;
}

th,
td{
 border:1px solid var(--border);
 padding:8px;
 text-align:left;
}

tbody tr:nth-child(even){
 background:#1b2437;
}

.song-table{
 max-height:700px;
 overflow:auto;
}

.tab-buttons{
 display:flex;
 gap:8px;
 margin-bottom:20px;
 flex-wrap:wrap;
}

.tab-button{
 cursor:pointer;
 border:none;
 border-radius:8px;
 padding:10px 14px;
}

.tab-content{
 display:none;
}

.tab-content.active{
 display:block;
}

canvas{
 background:white;
 border-radius:8px;
}

</style>
</head>

<body>

<header>
<h1>LIVE LOG</h1>
</header>

<div class="container">

<div class="cards">

<div class="card">
<div class="card-title">総ライブ数</div>
<div id="totalLives" class="card-value">0</div>
</div>

<div class="card">
<div class="card-title">BUMP OF CHICKEN</div>

</div>

</div>

<div class="card">
<div class="card-title">小田和正</div>
<div id="odaLives" class="card-value oda">0</div>
</div>

</div>

<div class="tab-buttons">

<button class="tab-button" onclick="showTab('dashboard')">

</button>

<button class="tab-button" onclick="showTab('lives')">

</div>

<div id="dashboard" class="tab-content active">

</div>

<div id="lives" class="tab-content">

<tbody id="liveTable"></tbody>

</table>

</div>

</div>

function showTab(id){

 document
  .querySelectorAll(".tab-content")
  .forEach(v=>v.classList.remove("active"));

 document
  .getElementById(id)
  .classList.add("active");

}

const yearFilter=
document.getElementById("yearFilter");

[
 ...new Set(
   liveData.map(v=>v.date.substring(0,4))
 )
]
.sort()
.forEach(year=>{

 const opt=document.createElement("option");

 opt.value=year;
 opt.textContent=year;

 yearFilter.appendChild(opt);

});

function renderLiveTable(){

 const artist=
 document.getElementById("artistFilter").value;

 const year=
 document.getElementById("yearFilter").value;

 const tbody=
 document.getElementById("liveTable");

 tbody.innerHTML="";

 liveData

 .filter(v=>
  !artist || v.artist===artist
 )

 .filter(v=>
  !year || v.date.startsWith(year)
 )

 .forEach(v=>{

  let cls="";

  if(v.artist==="BUMP")
    cls="bump";

  if(v.artist==="乃木坂")
    cls="nogi";

  if(v.artist==="小田和正")
    cls="oda";

  tbody.innerHTML += `
   <tr>
    <td>${v.date}</td>
    <td class="${cls}">${v.artist}</td>
    <td>${v.pref}</td>
    <td>${v.venue}</td>
    <td>${v.ticket.toLocaleString()}円</td>
   </tr>
  `;

 });

}

document
 .getElementById("artistFilter")
 .addEventListener("change",renderLiveTable);

document
 .getElementById("yearFilter")
 .addEventListener("change",renderLiveTable);
