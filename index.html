<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE LOG v2</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
 --bg:#0f172a;
 --panel:#1e293b;
 --border:#334155;
 --txt:#f8fafc;
 --bump:#ef4444;
 --nogi:#812990;
 --oda:#3b82f6;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font-family:sans-serif;
}

header{
 background:#111827;
 padding:20px;
 position:sticky;
 top:0;
 z-index:100;
}

.container{
 max-width:1600px;
 margin:auto;
 padding:16px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px;
 margin-bottom:20px;
}

.card{
 background:var(--panel);
 border-radius:12px;
 padding:16px;
}

.cardTitle{
 opacity:.8;
}

.cardValue{
 font-size:32px;
 font-weight:bold;
 margin-top:8px;
}

.panel{
 background:var(--panel);
 border-radius:12px;
 padding:16px;
 margin-bottom:20px;
}

.bump{color:var(--bump)}
.nogi{color:var(--nogi)}
.oda{color:var(--oda)}

.tabs{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:20px;
}

.tabBtn{
 border:none;
 border-radius:8px;
 padding:10px 16px;
 cursor:pointer;
}

.tab{
 display:none;
}

.tab.active{
 display:block;
}

.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:16px;
}

input,
select{
 padding:8px;
 border:none;
 border-radius:8px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 border:1px solid var(--border);
 padding:8px;
}

th{
 background:#192338;
}

tbody tr:nth-child(even){
 background:#243146;
}

canvas{
 background:white;
 border-radius:12px;
}

.songTable{
 max-height:700px;
 overflow:auto;
}
</style>
</head>

<body>

<header>
<h1>LIVE LOG</h1>
</header>

<div class="container">

<div class="cards">

<div class="card">
<div class="cardTitle">総ライブ数</div>
<div class="cardValue" id="totalLives">0</div>
</div>

<div class="card">
<div class="cardTitle">BUMP OF CHICKEN</div>
<div class="cardValue bump" id="bumpLives">0</div>
</div>

<div class="card">
<div class="cardTitle">乃木坂46</div>
<div class="cardValue nogi" id="nogiLives">0</div>
</div>

<div class="card">
<div class="cardTitle">小田和正</div>
<div class="cardValue oda" id="odaLives">0</div>
</div>

</div>

<div class="tabs">

<button class="tabBtn" onclick="showTab('dashboard')">
ダッシュボード
</button>

<button class="tabBtn" onclick="showTab('lives')">
ライブ一覧
</button>

<button class="tabBtn" onclick="showTab('bumpSongs')">
BUMP演奏曲
</button>

<button class="tabBtn" onclick="showTab('nogiSongs')">
乃木坂演奏曲
</button>

</div>

<div id="dashboard" class="tab active">

<div class="panel">
<h2>ライブ回数推移</h2>
<canvas id="yearChart"></canvas>
</div>

<div class="panel">
<h2>費用サマリー</h2>
<div id="costSummary"></div>
</div>

</div>

<div id="lives" class="tab">

<div class="panel">

<h2>ライブ一覧</h2>

<div class="filters">

<select id="artistFilter">
<option value="">全アーティスト</option>
<option value="BUMP">BUMP</option>
<option value="乃木坂">乃木坂</option>
<option value="小田和正">小田和正</option>
</select>

<select id="yearFilter">
<option value="">全年度</option>
</select>

<input
 id="venueSearch"
 placeholder="会場検索"
>

</div>

<table>

<thead>
<tr>
<th>日付</th>
<th>アーティスト</th>
<th>都道府県</th>
<th>会場</th>
<th>チケット代</th>
</tr>
</thead>

<tbody id="liveTable"></tbody>

</table>

</div>

</div>

<div id="bumpSongs" class="tab">

<div class="panel">

<h2>BUMP演奏曲ランキング</h2>

<div class="filters">
<input
 id="bumpSongSearch"
 placeholder="曲名検索"
>
</div>

<div class="songTable">

<table>

<thead>
<tr>
<th>曲名</th>
<th>披露回数</th>
</tr>
</thead>

<tbody id="bumpSongTable"></tbody>

</table>

</div>

</div>

</div>

<div id="nogiSongs" class="tab">

<div class="panel">

<h2>乃木坂演奏曲ランキング</h2>

<div class="filters">
<input
 id="nogiSongSearch"
 placeholder="曲名検索"
>
</div>

<div class="songTable">

<table>

<thead>
<tr>
<th>曲名</th>
<th>披露回数</th>
</tr>
</thead>

<tbody id="nogiSongTable"></tbody>

</table>

</div>

</div>

</div>

const bumpSongs = [
{name:"天体観測",count:28},
{name:"虹を待つ人",count:22},

{name:"乃木坂の詩",count:60},
{name:"好きというのはロックだぜ！",count:47},

{name:"Actually...",count:31}

document.getElementById("totalLives").textContent =
stats.totalLives;

document.getElementById("bumpLives").textContent =
stats.bumpLives;

document.getElementById("nogiLives").textContent =
stats.nogiLives;

document.getElementById("odaLives").textContent =
stats.odaLives;

document.getElementById("costSummary").innerHTML = `
<ul>
<li>BUMP チケット代: ${stats.bumpTicketCost.toLocaleString()}円</li>
<li>乃木坂 チケット代: ${stats.nogiTicketCost.toLocaleString()}円</li>
<li>BUMP 総費用: ${stats.bumpTotalCost.toLocaleString()}円</li>
<li>乃木坂 総費用: ${stats.nogiTotalCost.toLocaleString()}円</li>
</ul>
`;

function showTab(id){

 document
 .querySelectorAll(".tab")
 .forEach(tab=>{
  tab.classList.remove("active");
 });

 document
 .getElementById(id)
 .classList.add("active");

}

const yearFilter =
document.getElementById("yearFilter");

[
 ...new Set(
  liveData.map(
   live => live.date.substring(0,4)
  )
 )
]
.sort()
.forEach(year=>{

 const option =
 document.createElement("option");

 option.value = year;
 option.textContent = year;

 yearFilter.appendChild(option);

});

function renderLiveTable(){

 const artist =
 document.getElementById(
  "artistFilter"
 ).value;

 const year =
 document.getElementById(
  "yearFilter"
 ).value;

 const venueKeyword =
 document.getElementById(
  "venueSearch"
 ).value
 .toLowerCase();

 const tbody =
 document.getElementById(
  "liveTable"
 );

 tbody.innerHTML = "";

 liveData

 .filter(live =>
  !artist ||
  live.artist===artist
 )

 .filter(live =>
  !year ||
  live.date.startsWith(year)
 )

 .filter(live =>
  !venueKeyword ||
  live.venue.toLowerCase()
   .includes(venueKeyword)
 )

 .forEach(live=>{

  let artistClass="";

  if(live.artist==="BUMP"){
   artistClass="bump";
  }

  if(live.artist==="乃木坂"){
   artistClass="nogi";
  }

  if(live.artist==="小田和正"){
   artistClass="oda";
  }

  tbody.innerHTML += `
  <tr>
   <td>${live.date}</td>
   <td class="${artistClass}">
    ${live.artist}
   </td>
   <td>${live.pref}</td>
   <td>${live.venue}</td>
   <td>${live.ticket.toLocaleString()}円</td>
  </tr>
  `;

 });

}
function renderSongTables(){

 const bumpKeyword =
 document
 .getElementById("bumpSongSearch")
 .value
 .toLowerCase();

 const nogiKeyword =
 document
 .getElementById("nogiSongSearch")
 .value
 .toLowerCase();

 const bumpBody =
 document.getElementById(
  "bumpSongTable"
 );

 bumpBody.innerHTML = "";

 bumpSongs

 .filter(song =>
  !bumpKeyword ||
  song.name.toLowerCase()
  .includes(bumpKeyword)
 )

 .sort((a,b)=>
  b.count-a.count
 )

 .forEach(song=>{

  bumpBody.innerHTML += `
  <tr>
   <td>${song.name}</td>
   <td>${song.count}</td>
  </tr>
  `;

 });

 const nogiBody =
 document.getElementById(
  "nogiSongTable"
 );

 nogiBody.innerHTML = "";

 nogiSongs

 .filter(song =>
  !nogiKeyword ||
  song.name.toLowerCase()
  .includes(nogiKeyword)
 )

 .sort((a,b)=>
  b.count-a.count
 )

 .forEach(song=>{

  nogiBody.innerHTML += `
  <tr>
   <td>${song.name}</td>
   <td>${song.count}</td>
  </tr>
  `;

 });

}

document
.getElementById("artistFilter")
.addEventListener(
 "change",
 renderLiveTable
);

document
.getElementById("yearFilter")
.addEventListener(
 "change",
 renderLiveTable
);

document
.getElementById("venueSearch")
.addEventListener(
 "input",
 renderLiveTable
);

document
.getElementById("bumpSongSearch")
.addEventListener(
 "input",
 renderSongTables
);

document
.getElementById("nogiSongSearch")
.addEventListener(
 "input",
 renderSongTables
);
const yearlyStats = {};

liveData.forEach(live=>{

 const year =
 live.date.substring(0,4);

 if(!yearlyStats[year]){

  yearlyStats[year] = {
   BUMP:0,
   乃木坂:0,
   小田和正:0
  };

 }

 yearlyStats[year][live.artist]++;

});

const years =
Object.keys(yearlyStats)
.sort();

new Chart(

 document.getElementById(
  "yearChart"
 ),

 {

  type:"bar",

  data:{

   labels:years,

   datasets:[

    {
     label:"BUMP",
     backgroundColor:"#ef4444",
     data:years.map(
      year =>
      yearlyStats[year]["BUMP"] || 0
     )
    },

    {
     label:"乃木坂",
     backgroundColor:"#812990",
     data:years.map(
      year =>
      yearlyStats[year]["乃木坂"] || 0
     )
    },

    {
     label:"小田和正",
     backgroundColor:"#3b82f6",
     data:years.map(
      year =>
      yearlyStats[year]["小田和正"] || 0
     )
    }

   ]

  },

  options:{

   responsive:true,

   plugins:{
    legend:{
     position:"top"
    }
   },

   scales:{
    y:{
     beginAtZero:true,
     ticks:{
      stepSize:1
     }
    }
   }

  }

 }

);

renderLiveTable();
renderSongTables();

localStorage.setItem(
 "liveLogVersion",
 "2"
);

window.addEventListener(
 "beforeunload",
 ()=>{

  const activeTab =
  document.querySelector(
   ".tab.active"
  );

  if(activeTab){

   localStorage.setItem(
    "liveLogLastTab",
    activeTab.id
   );

  }

 }
);

const savedTab =
localStorage.getItem(
 "liveLogLastTab"
);

if(
 savedTab &&
 document.getElementById(savedTab)
){
 showTab(savedTab);
}
</script>

</body>

</html>
